services:
  # ─── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: laundry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry_secret
      POSTGRES_DB: laundry_oms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry_oms"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laundry-network

  # ─── Go API ─────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - type=gha
    container_name: laundry-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://laundry:laundry_secret@postgres:5432/laundry_oms?sslmode=disable
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laundry-network

  # ─── Next.js Frontend ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - type=gha
    container_name: laundry-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api
    networks:
      - laundry-network

networks:
  laundry-network:
    driver: bridge

volumes:
  postgres_data:
