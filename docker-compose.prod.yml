# Laundry OMS — Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  api:
    restart: always
    environment:
      LOG_LEVEL: info
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

volumes:
  pgdata_prod:
